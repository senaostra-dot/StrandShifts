<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Strand Shifts | Senior Relocation Concierge</title>
<meta name="description" content="Strand Shifts helps seniors and families with downsizing, relocation coordination, home resets, and thoughtful transition support in Colorado.">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --deep:#293126;
  --olive:#5f6d55;
  --sage:#8f9988;
  --cream:#fbf8ef;
  --sand:#e8dfd1;
  --mist:#f4f1ea;
  --white:#ffffff;
  --ink:#2f332c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Inter",sans-serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.65;
}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

header{
  min-height:100vh;
  padding:26px 22px 78px;
  background:
    linear-gradient(rgba(251,248,239,.88),rgba(251,248,239,.96)),
    url("assets/sheer-hallway-light.jpg") center/cover;
}

nav{
  max-width:1180px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{
  font-family:"Cormorant Garamond",serif;
  letter-spacing:.24em;
  font-weight:700;
  color:var(--deep);
  font-size:1.05rem;
}

.nav-links{
  display:flex;
  gap:18px;
  align-items:center;
}

.nav-links a{
  font-size:.76rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:700;
  color:#4d5249;
}

.btn{
  display:inline-block;
  border-radius:999px;
  padding:13px 22px;
  font-size:.78rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  font-weight:700;
  border:1px solid var(--deep);
}

.btn-dark{
  background:var(--deep);
  color:var(--cream);
}

.btn-light{
  color:var(--deep);
}

.hero{
  max-width:980px;
  margin:82px auto 0;
  text-align:center;
}

.logo-mark{
  width:168px;
  height:168px;
  margin:0 auto 34px;
  border-radius:50%;
  overflow:hidden;
  background:var(--sage);
  box-shadow:0 18px 70px rgba(41,49,38,.10);
}

.logo-mark img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.eyebrow,.section-tag{
  text-transform:uppercase;
  letter-spacing:.25em;
  font-size:.76rem;
  color:var(--olive);
  font-weight:700;
  margin-bottom:18px;
}

h1,h2,h3{
  font-family:"Cormorant Garamond",serif;
  color:var(--deep);
  font-weight:600;
}

h1{
  font-size:clamp(3.5rem,12vw,8rem);
  line-height
