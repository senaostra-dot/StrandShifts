<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Strand Shifts | Senior Relocation Concierge</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    :root{

      --deep:#293126;

      --olive:#5f6d55;

      --sage:#8f9988;

      --cream:#fbf8ef;

      --sand:#e8dfd1;

      --mist:#f4f1ea;

      --white:#fff;

      --ink:#2f332c;

    }

    *{box-sizing:border-box;margin:0;padding:0}

    html{scroll-behavior:smooth}

    body{

      font-family:"Inter",sans-serif;

      background:var(--cream);

      color:var(--ink);

      line-height:1.65;

    }

    a{text-decoration:none;color:inherit}

    img{max-width:100%;display:block}

    header{

      min-height:100vh;

      padding:26px 22px 70px;

      background:

        linear-gradient(rgba(251,248,239,.86),rgba(251,248,239,.96)),

        url("assets/sheer-hallway-light.jpg") center/cover;

    }

    nav{

      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:16px;

      max-width:1180px;

      margin:0 auto;

    }

    .brand{

      font-family:"Cormorant Garamond",serif;

      letter-spacing:.24em;

      font-size:1.1rem;

      font-weight:700;

      color:var(--deep);

    }

    .nav-links{

      display:flex;

      align-items:center;

      gap:18px;

    }

    .nav-links a{

      font-size:.76rem;

      text-transform:uppercase;

      letter-spacing:.12em;

      font-weight:700;

      color:#4d5249;

    }

    .btn{

      display:inline-block;

      border-radius:999px;

      padding:13px 22px;

      font-size:.78rem;

      letter-spacing:.1em;

      text-transform:uppercase;

      font-weight:700;

    }

    .btn-dark{

      background:var(--deep);

      color:var(--cream);

    }

    .btn-light{

      border:1px solid var(--deep);

      color:var(--deep);

    }

    .hero{

      max-width:980px;

      margin:82px auto 0;

      text-align:center;

    }

    .logo-mark{

      width:168px;

      height:168px;

      margin:0 auto 34px;

      border-radius:50%;

      overflow:hidden;

      box-shadow:0 18px 70px rgba(41,49,38,.08);

    }

    .logo-mark img{

      width:100%;

      height:100%;

      object-fit:cover;

    }

      text-transform:uppercase;

      letter-spacing:.25
